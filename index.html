<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chifa Cinco Estrellas | Comida Cantonesa</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- Navegación -->
  <header class="navbar">
    <div class="logo">
      <h1>Chifa Cinco Estrellas ⭐⭐⭐⭐⭐</h1>
      <span>Especialidad en Comida Cantonesa</span>
    </div>
    <nav>
      <a href="#menu">Carta</a>
      <button id="cart-btn" class="btn-cart">
        <i class="fas fa-shopping-cart"></i> (<span id="cart-count">0</span>)
      </button>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2>Sabor Tradicional Oriental en San Borja</h2>
      <p>Atendemos Almuerzos, Cenas, Recepciones y Delivery</p>
      <a href="#menu" class="btn-primary">Ver Menú Completo</a>
    </div>
  </section>

  <!-- Carta con Filtros -->
  <section id="menu" class="container">
    <h2 class="section-title">Nuestra Carta</h2>

    <div class="filter-buttons">
      <button class="btn-filter active" data-category="todos">Todos</button>
      <button class="btn-filter" data-category="bocaditos">Bocaditos</button>
      <button class="btn-filter" data-category="sopas">Sopas</button>
      <button class="btn-filter" data-category="especiales">Especiales</button>
      <button class="btn-filter" data-category="langostinos">Langostinos</button>
      <button class="btn-filter" data-category="carnes">Carnes & Res</button>
      <button class="btn-filter" data-category="pato">Pato Asado</button>
      <button class="btn-filter" data-category="chaufa">Chaufas</button>
      <button class="btn-filter" data-category="tallarines">Tallarines</button>
      <button class="btn-filter" data-category="combos">Combos</button>
      <button class="btn-filter" data-category="bebidas">Bebidas</button>
    </div>

    <div id="menu-grid" class="menu-grid"></div>
  </section>

  <!-- Modal del Carrito de Compras -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2><i class="fas fa-shopping-cart"></i> Tu Pedido</h2>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-summary">
        <h3>Total: S/ <span id="cart-total">0.00</span></h3>
        <button id="whatsapp-send-btn" class="btn-whatsapp">
          <i class="fab fa-whatsapp"></i> Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
